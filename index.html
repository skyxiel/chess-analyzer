<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9823;</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="upload-screen" class="screen active">
            <div class="upload-container">
                <h1>Chess Analyzer</h1>
                <p class="subtitle">Free browser-based game analysis powered by Stockfish</p>

                <div id="drop-zone" class="drop-zone">
                    <div class="drop-zone-content">
                        <span class="drop-icon">+</span>
                        <p>Drop a PGN file here</p>
                        <span class="drop-or">or</span>
                        <label for="file-input" class="file-label">Choose File</label>
                        <input type="file" id="file-input" accept=".pgn,.txt" hidden>
                    </div>
                </div>

                <div class="divider"><span>or paste PGN</span></div>

                <textarea id="pgn-input" placeholder="1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 ..."></textarea>

                <div class="analyze-options">
                    <label>
                        Engine Depth:
                        <select id="depth-select">
                            <option value="10">10 (Fast)</option>
                            <option value="14" selected>14 (Balanced)</option>
                            <option value="18">18 (Deep)</option>
                            <option value="22">22 (Very Deep)</option>
                        </select>
                    </label>
                </div>

                <button id="analyze-btn" class="btn-primary">Analyze Game</button>
                <p id="upload-error" class="error-text"></p>
            </div>
        </div>

        <div id="analysis-screen" class="screen">
            <header>
                <div class="header-left"><h1>Chess Analyzer</h1></div>
                <div class="header-right">
                    <button id="export-btn" class="btn-secondary">Export PGN</button>
                    <button id="new-game-btn" class="btn-secondary">New Game</button>
                </div>
            </header>

            <div id="game-info" class="game-info"></div>

            <div id="main-content">
                <div id="board-section">
                    <div id="player-top" class="player-bar">
                        <span class="player-name"></span>
                        <span class="player-stats"></span>
                    </div>
                    <div id="board-wrapper">
                        <div id="eval-bar">
                            <div id="eval-fill"></div>
                            <span id="eval-text">0.0</span>
                        </div>
                        <div id="board"></div>
                    </div>
                    <div id="player-bottom" class="player-bar">
                        <span class="player-name"></span>
                        <span class="player-stats"></span>
                    </div>
                    <div id="controls">
                        <button id="btn-start" title="Go to start">|&lt;</button>
                        <button id="btn-prev" title="Previous move">&lt;</button>
                        <button id="btn-next" title="Next move">&gt;</button>
                        <button id="btn-end" title="Go to end">&gt;|</button>
                        <button id="btn-flip" title="Flip board">Flip</button>
                        <button id="btn-autoplay" title="Auto-play">Play</button>
                    </div>
                </div>

                <div id="side-panel">
                    <div id="move-list-container">
                        <div id="move-list"></div>
                    </div>
                    <div id="engine-panel">
                        <div id="engine-header">
                            <span>Stockfish</span>
                            <span id="engine-depth"></span>
                        </div>
                        <div id="engine-eval"></div>
                        <div id="engine-line"></div>
                    </div>
                    <div id="summary-panel" class="hidden">
                        <h3>Game Summary</h3>
                        <div id="summary-content"></div>
                    </div>
                </div>
            </div>

            <div id="eval-graph-section">
                <canvas id="eval-graph"></canvas>
            </div>

            <div id="progress-overlay" class="hidden">
                <div class="progress-content">
                    <h3>Analyzing game...</h3>
                    <div class="progress-bar-container">
                        <div id="progress-bar"></div>
                    </div>
                    <span id="progress-text">Initializing engine...</span>
                    <button id="cancel-analysis" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
